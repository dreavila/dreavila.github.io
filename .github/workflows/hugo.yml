# Nombre descriptivo que aparecerá en la pestaña "Actions" de tu repositorio en GitHub
name: Deploy Hugo site to Pages

# CUÁNDO SE EJECUTA ESTE FLUJO DE TRABAJO
on:
  push:
    branches:
      - main # Se activa automáticamente cada vez que envías cambios (git push) a la rama 'main'
  workflow_dispatch: # Permite también presionar un botón manual en GitHub para ejecutar el flujo si lo necesitas

# PERMISOS DEL SERVIDOR DE GITHUB
permissions:
  contents: read # Permite al servidor leer el código de tu repositorio
  pages: write    # Permite al servidor escribir/publicar en tu área de GitHub Pages
  id-token: write # Permite autenticar la publicación de forma segura

# EVITAR COLISIONES DE PUBLICACIÓN
concurrency:
  group: "pages"
  cancel-in-progress: false # Si haces dos 'push' muy seguidos, espera a que termine el primero antes de iniciar el segundo

defaults:
  run:
    shell: bash # Define que todos los comandos de la consola se ejecuten usando Bash

# DEFINICIÓN DE LOS TRABAJOS (JOBS) QUE REALIZARÁ LA MÁQUINA VIRTUAL
jobs:

  # --- PRIMER TRABAJO: COMPILAR EL SITIO (BUILD) ---
  build:
    runs-on: ubuntu-latest # Pide a GitHub una máquina virtual gratuita con Linux Ubuntu
    env:
      HUGO_VERSION: 0.167.0 # Define la versión de Hugo que quieres que use la máquina virtual

    steps: # Pasos secuenciales que ejecutará la máquina Linux:

      # Paso 1: Descarga e instala Hugo Extended en la máquina de GitHub
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Paso 2: Clona tu repositorio (tu código, fotos y temas) dentro de la máquina virtual
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Descarga también los temas instalados como submódulos de Git (ej. PaperMod)
          fetch-depth: 0        # Descarga todo el historial para que Hugo calcule correctamente las fechas de los posts

      # Paso 3: Prepara la integración con GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Paso 4: Ejecuta el comando 'hugo' para compilar el sitio en archivos web estáticos
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \ # Garbage Collection: limpia archivos temporales innecesarios para reducir tamaño
            --minify \ # Comprime el código HTML, CSS y JS para que tu blog cargue ultrarrápido
            --baseURL "${{ steps.pages.outputs.base_url }}/" # Asigna automáticamente la URL pública

      # Paso 5: Empaqueta la carpeta /public (donde Hugo generó la web) para enviarla al siguiente paso
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # --- SEGUNDO TRABAJO: PUBLICAR EN INTERNET (DEPLOY) ---
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Genera el enlace público final de tu blog
    runs-on: ubuntu-latest
    needs: build # Este trabajo solo inicia cuando el trabajo 'build' anterior termina con éxito

    steps:
      # Paso 1: Toma el paquete generado en el paso anterior y lo despliega en los servidores globales de GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4